<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D 独立窗口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 100%);
    }
    #live2d-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* 放大 Live2D 模型 */
    #live2d {
      transform: scale(2) translateX(70px);
      transform-origin: bottom center;
    }
  </style>
  <!-- 加载 Live2D Widget -->
  <script src="/live2d-widget-temp/dist/autoload.js"></script>
</head>
<body>
  <div id="live2d-container"></div>
</body>
</html>
